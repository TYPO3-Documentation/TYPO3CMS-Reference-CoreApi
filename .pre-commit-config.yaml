repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0  # Use the latest version
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
  - repo: local
    hooks:
      - id: commit-message
        name: Commit message follows AGENTS.md
        entry: php Build/Scripts/commitMessageLint.php
        language: system
        stages: [commit-msg]
