<f:for each="{conference.sessions}" as="session" key="key" iteration="i">
  <f:form.validationResults for="conference.sessions.{key}.title">
    <f:for each="{validationResults.errors}" as="error">
      <p class="error">{error.message}</p>
    </f:for>
  </f:form.validationResults>
  <f:form.textfield property="sessions.{i.index}.title" />
</f:for>
