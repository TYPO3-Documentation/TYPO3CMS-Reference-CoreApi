{escaping off}
[
  <f:for each="{items}" as="item" iteration="iteration">
    {
      "title": <f:format.json value="{item.navigationTitle}" />,
      "hreflang": <f:format.json value="{item.hreflang}" />,
      "link": <f:format.json value="{item.link}" />,
      "active": {f:if(condition: item.active, then: 'true', else: 'false')},
      "available": {f:if(condition: item.available, then: 'true', else: 'false')}
    }<f:if condition="{iteration.isLast}"><f:else>,</f:else></f:if>
  </f:for>
]
