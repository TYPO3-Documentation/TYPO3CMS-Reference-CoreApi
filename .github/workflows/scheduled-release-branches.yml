name: release branches

# GitHub runs scheduled workflows on the default branch only, so this workflow
# checks out each release branch itself. tests.yml covers main.
on:
  schedule:
    - cron: "30 3 * * *" # every day at 03:30 UTC
  workflow_dispatch:

jobs:
  functional:
    if: github.repository == 'TYPO3-Documentation/TYPO3CMS-Reference-CoreApi'
    name: Example extension ${{ matrix.branch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: '14.3'
            php: '8.2'
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ matrix.branch }}

      - name: Install testing system
        run: Build/Scripts/runTests.sh -p ${{ matrix.php }} -s composerUpdate

      - name: Example extension
        run: Build/Scripts/runTests.sh -p ${{ matrix.php }} -s functional
